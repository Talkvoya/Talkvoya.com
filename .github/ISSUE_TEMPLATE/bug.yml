name: Report a bug / 报告问题
description: Report a reproducible installation or app issue
body:
  - type: markdown
    attributes:
      value: Keep API keys, chats, personal data, and sensitive files out of public reports. 请移除密钥、聊天、个人信息和敏感文件。
  - type: input
    id: app
    attributes:
      label: Harness version / 应用版本
      placeholder: "1.5.7"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device / Android 版本与机型
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result, and actual result / 复现步骤、预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots / 已脱敏日志或截图
