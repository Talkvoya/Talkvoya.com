name: Suggest a feature / 功能建议
description: Explain a task you want Harness to help with
body:
  - type: textarea
    id: task
    attributes:
      label: Your use case / 使用场景
      description: What do you want to do, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Desired outcome / 期望效果
    validations:
      required: true
