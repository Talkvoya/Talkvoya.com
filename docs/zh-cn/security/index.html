<main id="main"><section class="hero"><p class="eyebrow">Talkvoya · 官方发布中心</p><h1>安全政策</h1></section>
<article class="content"><p><a href="../../security/">English</a> · <a href="../support/">支持</a></p>
<p>提交安全报告时，请标注<a href="../download/">下载中心</a>所列的当前稳定版。如果问题出现在旧安装包，也请注明对应版本。</p>
<p>请使用 <a href="https://github.com/Talkvoya/Talkvoya.com/security/advisories/new">GitHub 私密漏洞报告</a>。表单不可用时，可以通过应用内<strong>设置 → 关于 → 联系我们</strong>的官方入口索取私密报告渠道。</p>
<p>请提供受影响版本、问题影响和可安全复现的步骤。报告中请勿放入 API 密钥、个人记录或私密聊天内容。普通产品故障可使用 <a href="https://github.com/Talkvoya/Talkvoya.com/issues/new/choose">GitHub 反馈表单</a>。</p>
